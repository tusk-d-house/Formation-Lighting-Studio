name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: runtime/resources/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: runtime/resources/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Create macOS .icns icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     electron/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     electron/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     electron/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     electron/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   electron/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   electron/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   electron/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   electron/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   electron/icon.png --out icon.iconset/icon_512x512.png
          cp electron/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Package macOS .app (Universal)
        run: |
          mkdir -p app_stage
          cp -R dist app_stage/dist
          cp -R electron app_stage/electron
          printf '{"name":"formation-studio","version":"1.0.0","main":"electron/main.cjs"}\n' > app_stage/package.json
          npx --yes @electron/packager@18.3.6 app_stage "Formation & Lighting Studio" \
            --platform=darwin \
            --arch=universal \
            --electron-version=33.1.0 \
            --icon=icon.icns \
            --app-bundle-id=com.tuskdhouse.formationstudio \
            --out=release-mac \
            --overwrite

      - name: Create .zip and .dmg installers
        run: |
          APP_PATH="release-mac/Formation & Lighting Studio-darwin-universal/Formation & Lighting Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-mac/FormationStudio-Mac.zip"
          mkdir -p dmg_stage
          cp -R "$APP_PATH" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Formation & Lighting Studio" -srcfolder dmg_stage -ov -format UDZO "release-mac/FormationStudio-Mac.dmg"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FormationStudio-Mac
          path: |
            runtime/resources/app/release-mac/FormationStudio-Mac.dmg
            runtime/resources/app/release-mac/FormationStudio-Mac.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Formation & Lighting Studio v1.0.0
          body: |
            Formation & Lighting Studio のリリースページです。

            ### Mac 版のダウンロード・起動方法
            1. 下の Assets から **`FormationStudio-Mac.dmg`** をダウンロードして開きます（Apple Silicon / Intel Mac 両対応）。
            2. **`Formation & Lighting Studio`** を **Applications（アプリケーション）** フォルダへドラッグ＆ドロップします。
            3. 初回起動時に「開発元を確認できないため開けません」と表示された場合は、アプリアイコンを **Control + クリック（右クリック）＞「開く」**（または「システム設定」＞「プライバシーとセキュリティ」＞「このまま開く」）から起動してください。

            ### Windows 版のダウンロード・起動方法
            - リポジトリトップの緑色の **`<> Code` ＞ `Download ZIP`** からダウンロード・解凍し、**`FormationStudio.exe`** を開いてください。
          files: |
            runtime/resources/app/release-mac/FormationStudio-Mac.dmg
            runtime/resources/app/release-mac/FormationStudio-Mac.zip
